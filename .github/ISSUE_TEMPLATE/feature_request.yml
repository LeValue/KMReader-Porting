name: Feature request
description: Suggest an improvement for KMReader.
body:
  - type: markdown
    attributes:
      value: Check existing issues and the roadmap before requesting a feature. Do not include credentials or personal account data.
  - type: textarea
    id: task
    attributes:
      label: What would you like to do?
      description: Describe the task and the limitation you currently encounter.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: platforms
    attributes:
      label: Relevant platforms and services
      placeholder: Android / Windows; Komga / Kindle / local files
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or related issues
