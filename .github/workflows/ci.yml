name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish the verified Android APK to the development preview release
        type: boolean
        default: false
      preview_blob:
        description: Git blob containing the locally signed optimized preview APK
        type: string
        default: ''
      preview_sha256:
        description: SHA256 of the verified signed APK
        type: string
        default: ''
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reserve space for the optimized Android build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/ghc /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - name: Verify portable Waifu2x with the real ONNX runtime
        run: KMREADER_ONNX_TEST=1 LD_LIBRARY_PATH="$PUB_CACHE/hosted/pub.dev/onnxruntime_v2-1.23.2+2/linux" flutter test test/upscaler_test.dart --no-pub
      - name: Test the client against Komga
        run: |
          curl --fail --location https://github.com/gotson/komga/releases/download/1.29.1/komga-1.29.1.jar --output /tmp/komga.jar
          python3 tool/komga_smoke.py --jar /tmp/komga.jar
      - name: Restore the pinned Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: kmreader-ndk-${{ runner.os }}-28.2.13676358
      - name: Install and verify the pinned Android NDK
        run: bash tool/install_android_ndk.sh
      - run: flutter build apk --release
        env:
          ORG_GRADLE_PROJECT_kmreaderPreview: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Verify EPUB in native Windows WebView2
        run: flutter drive --driver=test_driver/native_reader_driver.dart --target=integration_test/epub_reader_test.dart -d windows --no-pub
      - run: flutter build windows --release
      - name: Launch the native Windows app in an isolated profile
        shell: pwsh
        run: ./tool/windows_startup_smoke.ps1 -Executable build/windows/x64/runner/Release/kmreader.exe -OutputDirectory "${{ runner.temp }}/windows-startup"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup
          path: ${{ runner.temp }}/windows-startup/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Release/
  android_reader_display:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk space for the emulator and Android build
        run: |
          # This job uses neither .NET, Haskell nor CodeQL. Only the disposable
          # runner's preinstalled toolchains are removed; the checkout is kept.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/ghc /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: flutter pub get --enforce-lockfile
      - name: Restore the pinned Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: kmreader-ndk-${{ runner.os }}-28.2.13676358
      - name: Install and verify the pinned Android NDK
        run: bash tool/install_android_ndk.sh
      - name: Enable KVM access on the isolated runner
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Bound build memory before starting the emulator
        run: |
          python3 - <<'PYMEM'
          from pathlib import Path
          p=Path('android/gradle.properties')
          lines=p.read_text().splitlines()
          lines=[line for line in lines if not line.startswith(('org.gradle.jvmargs=','org.gradle.workers.max=','kotlin.daemon.jvmargs='))]
          lines += ['org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m','org.gradle.workers.max=2','kotlin.daemon.jvmargs=-Xmx768m']
          p.write_text('\n'.join(lines)+'\n')
          PYMEM
      - name: Compile native test dependencies before allocating emulator memory
        run: flutter build apk --debug --target=integration_test/reader_display_test.dart --no-pub
        env:
          ORG_GRADLE_PROJECT_kmreaderPreview: 'true'
      - name: Reserve AVD space after the dependency build
        run: |
          sudo python3 - "$ANDROID_SDK_ROOT" <<'PYDISK'
          import shutil,sys
          from pathlib import Path
          sdk=Path(sys.argv[1])
          for version in (sdk/'ndk').iterdir():
              if version.is_dir() and version.name!='28.2.13676358': shutil.rmtree(version)
          # The action below installs its one required API 35 image.
          if (sdk/'system-images').exists(): shutil.rmtree(sdk/'system-images')
          PYDISK
          df -h .
      - name: Exercise real Android WindowInsets with a simulated notch
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORG_GRADLE_PROJECT_kmreaderPreview: 'true'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 1536M
          heap-size: 256M
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tool/android_native_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reader-display
          path: |
            artifacts/android-reader-display/*.png
            artifacts/native-epub/*.png
            ${{ runner.temp }}/reader-logcat.txt
  publish_android_preview:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.ref == 'refs/heads/main'
    needs: [android, windows, android_reader_display]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: android-development-preview
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.5.0-preview.1
      PREVIEW_BLOB: ${{ inputs.preview_blob }}
      PREVIEW_SHA256: ${{ inputs.preview_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
      - name: Retrieve and verify the signed optimized preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os, re
          for name, length in [('PREVIEW_BLOB', 40), ('PREVIEW_SHA256', 64)]:
              if not re.fullmatch('[0-9a-f]{' + str(length) + '}', os.environ[name]):
                  raise SystemExit('A verified signed preview is required: ' + name)
          PYCODE
          gh api "repos/$GH_REPO/git/blobs/$PREVIEW_BLOB" > preview-blob.json
          python3 - <<'PYCODE'
          import base64, gzip, hashlib, json, lzma, os
          from pathlib import Path
          blob = json.loads(Path('preview-blob.json').read_text())
          if blob['encoding'] != 'base64':
              raise SystemExit('Unsupported blob encoding')
          content = base64.b64decode(blob['content'])
          if hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest() != os.environ['PREVIEW_BLOB']:
              raise SystemExit('Git blob hash mismatch')
          content = lzma.decompress(content) if content.startswith(b'\xfd7zXZ\x00') else gzip.decompress(content)
          digest = hashlib.sha256(content).hexdigest()
          if digest != os.environ['PREVIEW_SHA256']:
              raise SystemExit('APK SHA256 mismatch')
          name = 'KMReader-0.5.0-android-preview.apk'
          Path(name).write_bytes(content)
          Path('SHA256SUMS.txt').write_text(digest + '  ' + name + '\n')
          PYCODE
          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$sdk_tools/apksigner" verify --verbose --print-certs KMReader-0.5.0-android-preview.apk > apk-signature.txt
          "$sdk_tools/zipalign" -c -P 16 4 KMReader-0.5.0-android-preview.apk
          python3 - <<'PYCODE'
          from pathlib import Path
          expected = Path('tool/preview-certificate.sha256').read_text().strip()
          signature = Path('apk-signature.txt').read_text()
          if 'Signer #1 certificate SHA-256 digest: ' + expected not in signature:
              raise SystemExit('Unexpected preview signing certificate')
          print('Signed optimized APK matches its digest, certificate and alignment checks.')
          PYCODE
          gh api "repos/$GH_REPO/releases" > releases.json
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          releases = json.loads(Path('releases.json').read_text())
          release = next(r for r in releases if r['tag_name'] == os.environ['RELEASE_TAG'])
          if not release['draft'] or release['assets']:
              raise SystemExit('Publish only to the prepared empty draft; existing assets are preserved.')
          Path('release-id.txt').write_text(str(release['id']))
          Path('release-notes.md').write_text(f'''KMReader 0.5.0 development preview for Android and Windows.

          Download `KMReader-0.5.0-android-preview.apk` in Assets. This is an AOT-compiled release-mode APK, not a debug build. It supports Android 7.0+ and ARMv7, ARM64 and x86_64.

          It installs as **KMReader Preview** (`dev.levalue.kmreader.preview`) alongside the first debug preview, without changing that original app's local data. It updates previous optimized Preview builds in place, retaining their accounts and reading data. Future optimized previews use the same retained development certificate.

          This update corrects Android fullscreen on phones with a camera notch. Native cutout and stable system-bar insets protect comic/EPUB/PDF titles, controls and sheets even when Flutter reports zero padding. Comic pages avoid the actual display cutout by default in portrait and landscape; extending the image behind the notch is an explicit reader preference. System bars remain hidden and their space remains available for reading.

          Reader settings now include optional conservative/aggressive border cropping using upstream thresholds and safety limits, plus a configurable 1x-8x double-tap zoom scale. Border analysis uses a bounded raster and scans away from the UI isolate; original files remain unchanged. The dashboard adds Recently Read and Recently Released sections, library-scoped See All queries, and persistent large/medium/small/horizontal card choices.

          For Windows 10/11 x64, download `KMReader-0.5.0-windows-x64-preview.zip`, extract the whole folder and start `KMReader/kmreader.exe`. The portable bundle includes the MSVC runtime. It is not Authenticode signed. CI builds and launches the native Windows window in an isolated profile; this startup check does not establish complete device/visual parity.

          Source: `{os.environ['GITHUB_SHA']}`. The signed APK was built and validated locally from this source; CI independently passed tests, real Komga integration and optimized Android compilation before publishing. SHA256, signing-certificate and alignment checks were repeated on the exact uploaded APK. Windows compilation is a separate job in the same workflow.

          This remains a development port: full functional/visual parity and device performance acceptance are still in progress. See docs/PARITY.md and docs/PERFORMANCE.md. Sign into an authorized GitHub account to download from this private repository.
          ''')
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows-bundle
      - name: Package the Windows portable build
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, zipfile
          from pathlib import Path
          root = Path('windows-bundle')
          required = ['kmreader.exe', 'flutter_windows.dll', 'data/app.so']
          if any(not (root / name).is_file() for name in required):
              raise SystemExit('Incomplete Windows application bundle')
          if not list(root.glob('vcruntime140*.dll')):
              raise SystemExit('MSVC runtime is missing from the portable Windows bundle')
          target = Path('KMReader-0.5.0-windows-x64-preview.zip')
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as archive:
              for file in sorted(root.rglob('*')):
                  if file.is_file():
                      archive.write(file, 'KMReader/' + file.relative_to(root).as_posix())
          with Path('SHA256SUMS.txt').open('a') as checksums:
              checksums.write(hashlib.sha256(target.read_bytes()).hexdigest() + '  ' + target.name + '\n')
          PYCODE
      - name: Upload assets, verify their digest and publish the preview
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" KMReader-0.5.0-android-preview.apk KMReader-0.5.0-windows-x64-preview.zip SHA256SUMS.txt
          release_id=$(cat release-id.txt)
          gh api "repos/$GH_REPO/releases/$release_id" > uploaded-release.json
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          release = json.loads(Path('uploaded-release.json').read_text())
          for name in ['KMReader-0.5.0-android-preview.apk', 'KMReader-0.5.0-windows-x64-preview.zip', 'SHA256SUMS.txt']:
              asset = next(a for a in release['assets'] if a['name'] == name)
              with Path(name).open('rb') as stream:
                  digest = 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
              if asset['state'] != 'uploaded' or asset['size'] != Path(name).stat().st_size or asset['digest'] != digest:
                  raise SystemExit(f'Uploaded asset verification failed: {name}')
          print('All release assets match GitHub SHA256 digests.')
          PYCODE
          gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --notes-file release-notes.md --draft=false --prerelease --latest=false
