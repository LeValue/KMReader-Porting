name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish the verified Android APK to the development preview release
        type: boolean
        default: false
      preview_blob:
        description: Git blob containing the locally signed optimized preview APK
        type: string
        default: ''
      preview_sha256:
        description: SHA256 of the verified signed APK
        type: string
        default: ''
      preview_armv7_blob:
        description: Git blob of the signed ARMv7 APK
        type: string
        default: ''
      preview_armv7_sha256:
        description: SHA256 of the signed ARMv7 APK
        type: string
        default: ''
      preview_x64_blob:
        description: Git blob of the signed x86_64 APK
        type: string
        default: ''
      preview_x64_sha256:
        description: SHA256 of the signed x86_64 APK
        type: string
        default: ''
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reserve space for the optimized Android build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/ghc /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: python3 tool/preview_metadata.py
      - run: flutter analyze
      - run: flutter test
      - name: Verify portable image models with the real ONNX runtime
        run: KMREADER_ONNX_TEST=1 LD_LIBRARY_PATH="$PUB_CACHE/hosted/pub.dev/onnxruntime_v2-1.23.2+2/linux" flutter test test/upscaler_test.dart test/bubble_detector_test.dart --no-pub
      - name: Test the client against Komga
        run: |
          curl --fail --location https://github.com/gotson/komga/releases/download/1.29.1/komga-1.29.1.jar --output /tmp/komga.jar
          python3 tool/komga_smoke.py --jar /tmp/komga.jar
      - name: Restore the pinned Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: kmreader-ndk-${{ runner.os }}-28.2.13676358
      - name: Install and verify the pinned Android NDK
        run: bash tool/install_android_ndk.sh
      - run: flutter build apk --release
        env:
          ORG_GRADLE_PROJECT_kmreaderPreview: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Verify EPUB in native Windows WebView2
        run: flutter drive --driver=test_driver/native_reader_driver.dart --target=integration_test/epub_reader_test.dart -d windows --no-pub
      - run: flutter build windows --release
      - name: Launch the native Windows app in an isolated profile
        shell: pwsh
        run: ./tool/windows_startup_smoke.ps1 -Executable build/windows/x64/runner/Release/kmreader.exe -OutputDirectory "${{ runner.temp }}/windows-startup"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup
          path: ${{ runner.temp }}/windows-startup/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Release/
  android_reader_display:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk space for the emulator and Android build
        run: |
          # This job uses neither .NET, Haskell nor CodeQL. Only the disposable
          # runner's preinstalled toolchains are removed; the checkout is kept.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/ghc /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: flutter pub get --enforce-lockfile
      - name: Restore the pinned Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: kmreader-ndk-${{ runner.os }}-28.2.13676358
      - name: Install and verify the pinned Android NDK
        run: bash tool/install_android_ndk.sh
      - name: Enable KVM access on the isolated runner
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Bound build memory before starting the emulator
        run: |
          python3 - <<'PYMEM'
          from pathlib import Path
          p=Path('android/gradle.properties')
          lines=p.read_text().splitlines()
          lines=[line for line in lines if not line.startswith(('org.gradle.jvmargs=','org.gradle.workers.max=','kotlin.daemon.jvmargs='))]
          lines += ['org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m','org.gradle.workers.max=2','kotlin.daemon.jvmargs=-Xmx768m']
          p.write_text('\n'.join(lines)+'\n')
          PYMEM
      - name: Compile native test dependencies before allocating emulator memory
        run: flutter build apk --debug --target=integration_test/reader_display_test.dart --no-pub
        env:
          ORG_GRADLE_PROJECT_kmreaderPreview: 'true'
      - name: Reserve AVD space after the dependency build
        run: |
          sudo python3 - "$ANDROID_SDK_ROOT" <<'PYDISK'
          import shutil,sys
          from pathlib import Path
          sdk=Path(sys.argv[1])
          for version in (sdk/'ndk').iterdir():
              if version.is_dir() and version.name!='28.2.13676358': shutil.rmtree(version)
          # The action below installs its one required API 35 image.
          if (sdk/'system-images').exists(): shutil.rmtree(sdk/'system-images')
          PYDISK
          df -h .
      - name: Exercise real Android WindowInsets with a simulated notch
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORG_GRADLE_PROJECT_kmreaderPreview: 'true'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 1536M
          heap-size: 256M
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tool/android_native_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reader-display
          path: |
            artifacts/android-reader-display/*.png
            artifacts/native-epub/*.png
            ${{ runner.temp }}/reader-logcat.txt
  publish_android_preview:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.ref == 'refs/heads/main'
    needs: [android, windows, android_reader_display]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: android-development-preview
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_BLOB: ${{ inputs.preview_blob }}
      PREVIEW_SHA256: ${{ inputs.preview_sha256 }}
      ARMV7_BLOB: ${{ inputs.preview_armv7_blob }}
      ARMV7_SHA256: ${{ inputs.preview_armv7_sha256 }}
      X64_BLOB: ${{ inputs.preview_x64_blob }}
      X64_SHA256: ${{ inputs.preview_x64_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
      - name: Select the versioned preview from this source
        run: python3 tool/preview_metadata.py --github-env
      - name: Retrieve and verify the signed optimized preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, hashlib, json, lzma, os, re, subprocess
          from pathlib import Path
          files = [('PREVIEW', 'APK_NAME'), ('ARMV7', 'ARMV7_NAME'), ('X64', 'X64_NAME')]
          checksums = []
          for prefix, name_key in files:
              blob_id, expected = os.environ[prefix + '_BLOB'], os.environ[prefix + '_SHA256']
              if not re.fullmatch('[0-9a-f]{40}', blob_id) or not re.fullmatch('[0-9a-f]{64}', expected):
                  raise SystemExit('A verified signed architecture APK is required: ' + prefix)
              blob = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GH_REPO"]}/git/blobs/{blob_id}']))
              if blob['encoding'] != 'base64':
                  raise SystemExit('Unsupported blob encoding')
              content = base64.b64decode(blob['content'], validate=False)
              if hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest() != blob_id:
                  raise SystemExit('Git blob hash mismatch')
              content = lzma.decompress(content)
              digest = hashlib.sha256(content).hexdigest()
              if digest != expected:
                  raise SystemExit('APK SHA256 mismatch')
              name = os.environ[name_key]
              Path(name).write_bytes(content)
              checksums.append(digest + '  ' + name)
          Path('SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n')
          PYCODE
          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            case "$abi" in
              arm64-v8a) apk="$APK_NAME" ;;
              armeabi-v7a) apk="$ARMV7_NAME" ;;
              x86_64) apk="$X64_NAME" ;;
            esac
            "$sdk_tools/apksigner" verify --verbose --print-certs "$apk" > apk-signature.txt
            "$sdk_tools/zipalign" -c -P 16 4 "$apk"
            "$sdk_tools/aapt2" dump badging "$apk" > apk-badging.txt
            python3 tool/preview_metadata.py --apk-badging apk-badging.txt --abi "$abi"
            python3 - <<'PYCODE'
          from pathlib import Path
          expected = Path('tool/preview-certificate.sha256').read_text().strip()
          signature = Path('apk-signature.txt').read_text()
          if 'Signer #1 certificate SHA-256 digest: ' + expected not in signature:
              raise SystemExit('Unexpected preview signing certificate')
          PYCODE
          done
          gh api "repos/$GH_REPO/releases" > releases.json
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          releases = json.loads(Path('releases.json').read_text())
          release = next(r for r in releases if r['tag_name'] == os.environ['RELEASE_TAG'])
          if not release['draft'] or release['assets']:
              raise SystemExit('Publish only to the prepared empty draft; existing assets are preserved.')
          Path('release-id.txt').write_text(str(release['id']))
          notes = Path('docs/releases') / (os.environ['RELEASE_TAG'] + '.md')
          Path('release-notes.md').write_text(notes.read_text().replace('@SOURCE@', os.environ['GITHUB_SHA']))
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows-bundle
      - name: Package the Windows portable build
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, os, zipfile
          from pathlib import Path
          root = Path('windows-bundle')
          required = ['kmreader.exe', 'flutter_windows.dll', 'data/app.so']
          if any(not (root / name).is_file() for name in required):
              raise SystemExit('Incomplete Windows application bundle')
          if not list(root.glob('vcruntime140*.dll')):
              raise SystemExit('MSVC runtime is missing from the portable Windows bundle')
          target = Path(os.environ['WINDOWS_NAME'])
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as archive:
              for file in sorted(root.rglob('*')):
                  if file.is_file():
                      archive.write(file, 'KMReader/' + file.relative_to(root).as_posix())
          with Path('SHA256SUMS.txt').open('a') as checksums:
              checksums.write(hashlib.sha256(target.read_bytes()).hexdigest() + '  ' + target.name + '\n')
          PYCODE
      - name: Upload assets, verify their digest and publish the preview
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$APK_NAME" "$ARMV7_NAME" "$X64_NAME" "$WINDOWS_NAME" SHA256SUMS.txt
          release_id=$(cat release-id.txt)
          gh api "repos/$GH_REPO/releases/$release_id" > uploaded-release.json
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads(Path('uploaded-release.json').read_text())
          for name in [os.environ[key] for key in ['APK_NAME', 'ARMV7_NAME', 'X64_NAME', 'WINDOWS_NAME']] + ['SHA256SUMS.txt']:
              asset = next(a for a in release['assets'] if a['name'] == name)
              with Path(name).open('rb') as stream:
                  digest = 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
              if asset['state'] != 'uploaded' or asset['size'] != Path(name).stat().st_size or asset['digest'] != digest:
                  raise SystemExit(f'Uploaded asset verification failed: {name}')
          print('All release assets match GitHub SHA256 digests.')
          PYCODE
          gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --notes-file release-notes.md --draft=false --prerelease --latest=false
