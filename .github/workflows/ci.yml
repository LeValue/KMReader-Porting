name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deliver_draft:
        description: Deliver already verified signed builds to an existing review draft without publishing
        type: boolean
        default: false
      android_universal:
        description: Deliver one signed universal Android APK instead of three per-ABI APKs
        type: boolean
        default: false
      apk_deltas:
        description: Reconstruct byte-exact locally signed APKs from the verified CI APK and transport blobs
        type: boolean
        default: false
      draft_tag:
        description: Existing empty version-matched release or candidate draft
        type: string
        default: ''
      preview_blob:
        description: Git blob containing the locally signed optimized preview APK
        type: string
        default: ''
      preview_sha256:
        description: SHA256 of the verified signed APK
        type: string
        default: ''
      preview_armv7_blob:
        description: Git blob of the signed ARMv7 APK
        type: string
        default: ''
      preview_armv7_sha256:
        description: SHA256 of the signed ARMv7 APK
        type: string
        default: ''
      preview_x64_blob:
        description: Git blob of the signed x86_64 APK
        type: string
        default: ''
      preview_x64_sha256:
        description: SHA256 of the signed x86_64 APK
        type: string
        default: ''
      verified_run:
        description: Optional completed successful CI run for this exact source; avoids duplicate builds
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  android:
    if: &run_verification github.event_name != 'workflow_dispatch' || !inputs.deliver_draft
    needs: android_python_wheels
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v4
      - &python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - &provenance
        run: python tool/prepare_build_metadata.py
      - &android_space
        name: Reserve space on the disposable Android runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/ghc /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - &android_java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - &android_sdk
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - &flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - &clang
        name: Ensure Clang is available for native Dart packages
        run: command -v clang >/dev/null || (sudo apt-get update && sudo apt-get install -y clang)
      - &pub
        run: flutter pub get --enforce-lockfile
      - &ndk_cache
        name: Restore the pinned Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: kmreader-ndk-${{ runner.os }}-28.2.13676358
      - &ndk_install
        name: Install and verify the pinned Android NDK
        run: bash tool/install_android_ndk.sh
      - &download_android_wheels
        uses: actions/download-artifact@v4
        with:
          name: android-python-wheels
          path: .dart_tool/android-python-wheels
      - name: Build the release APK with the production plugin registrant
        run: flutter build apk --release
        env:
          ORG_GRADLE_PROJECT_kmreaderPreview: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
  android_python_wheels:
    if: *run_verification
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *python
      - uses: actions/cache@v4
        id: wheels
        with:
          path: .dart_tool/android-python-wheels
          key: android-python-wheels-${{ runner.os }}-${{ hashFiles('tool/android_python/**') }}
      - uses: android-actions/setup-android@v3
        if: steps.wheels.outputs.cache-hit != 'true'
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        if: steps.wheels.outputs.cache-hit != 'true'
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: kmreader-ndk-${{ runner.os }}-28.2.13676358
      - if: steps.wheels.outputs.cache-hit != 'true'
        run: bash tool/install_android_ndk.sh
      - if: steps.wheels.outputs.cache-hit != 'true'
        run: bash tool/android_python/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-python-wheels
          path: .dart_tool/android-python-wheels/*.whl
          include-hidden-files: true
          if-no-files-found: error
  linux_host:
    if: *run_verification
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *python
      - *provenance
      - *flutter
      - *clang
      - *pub
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: python3 tool/preview_metadata.py
      - run: python3 -m unittest discover -s tool/tests
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
  linux_services:
    if: *run_verification
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *python
      - *provenance
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - *flutter
      - *clang
      - *pub
      - name: Verify shared Kindle runtime and real browser boundaries
        env:
          KMREADER_KINDLE_BROWSER_TEST: '1'
        run: |
          python3 -m pip install -r tool/kindle_personal/requirements.txt
          python3 -m playwright install chromium
          python3 -m unittest discover -s tool/kindle_personal/tests -v
          python3 -m tool.kindle_personal self-test --output artifacts/kindle-self-test.json --fixtures artifacts/kindle-native-fixtures
      - name: Verify prepared books through the app and exercise the shipped EPUB reader
        env:
          KMREADER_KINDLE_FIXTURES: artifacts/kindle-native-fixtures
          KMREADER_BROWSER_TEST: '1'
        run: flutter test tool/kindle_personal/tests/native_import_test.dart test/epub_browser_test.dart --no-pub
      - name: Verify portable image models with the real ONNX runtime
        run: KMREADER_ONNX_TEST=1 LD_LIBRARY_PATH="$PUB_CACHE/hosted/pub.dev/onnxruntime_v2-1.23.2+2/linux" flutter test test/upscaler_test.dart test/bubble_detector_test.dart --no-pub
      - name: Test the client against Komga
        run: |
          curl --fail --location https://github.com/gotson/komga/releases/download/1.29.1/komga-1.29.1.jar --output /tmp/komga.jar
          python3 tool/komga_smoke.py --jar /tmp/komga.jar
          curl --fail --location https://github.com/gotson/komga/releases/download/1.30.1/komga-1.30.1.jar --output /tmp/komga-admin.jar
          python3 -m tool.komga_admin.smoke --jar /tmp/komga-admin.jar
  windows_worker:
    if: *run_verification
    runs-on: windows-latest
    steps:
      - *checkout
      - *python
      - name: Build and verify the separate Kindle converter
        shell: pwsh
        run: |
          ./tool/build_kindle_worker.ps1
          Copy-Item artifacts/kindle-executable-check.json artifacts/kindle-delivery/
      - name: Retain the companion bundle for source-verified read-only probes
        uses: actions/upload-artifact@v4
        with:
          name: KMReader-Kindle-windows-x64
          path: |
            artifacts/kindle-delivery/*.zip
            artifacts/kindle-delivery/SHA256SUMS.txt
            artifacts/kindle-delivery/kindle-executable-check.json
  windows:
    needs: windows_worker
    if: *run_verification
    runs-on: windows-latest
    steps:
      - *checkout
      - *python
      - *provenance
      - &download_kindle_worker
        uses: actions/download-artifact@v4
        with:
          name: KMReader-Kindle-windows-x64
          path: artifacts/kindle-delivery
      - &extract_kindle_worker
        name: Reuse the verified Kindle converter from this run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $delivery = 'artifacts/kindle-delivery'
          foreach ($line in Get-Content (Join-Path $delivery 'SHA256SUMS.txt')) {
            if ($line -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9._-]+\.zip)$') {
              throw 'Invalid Kindle converter checksum entry'
            }
            $hash = $Matches[1]
            $archive = Join-Path $delivery $Matches[2]
            if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne $hash) {
              throw 'Kindle converter archive checksum mismatch'
            }
          }
          $bundle = @(Get-ChildItem $delivery/KMReader-Kindle-*-windows-x64.zip)
          if ($bundle.Count -ne 1) { throw 'Expected one Windows converter bundle' }
          Expand-Archive -Path $bundle[0].FullName -DestinationPath artifacts/kindle-dist -Force
          $metadata = Get-Content artifacts/kindle-dist/build.json -Raw | ConvertFrom-Json
          if ($metadata.source -ne $env:GITHUB_SHA -or !(Test-Path artifacts/kindle-dist/KMReader-Kindle/KMReader-Kindle.exe)) {
            throw 'Kindle converter source or executable mismatch'
          }
      - *flutter
      - &windows_desktop
        run: flutter config --enable-windows-desktop
      - *pub
      - name: Build the release bundle with the production plugin registrant
        run: flutter build windows --release
      - name: Include the on-demand Kindle converter
        shell: pwsh
        run: |
          Copy-Item artifacts/kindle-dist/KMReader-Kindle build/windows/x64/runner/Release/kindle -Recurse
          Copy-Item artifacts/kindle-delivery/*-source.zip build/windows/x64/runner/Release/
          Copy-Item assets/kindle/NOTICE.md build/windows/x64/runner/Release/Kindle-NOTICE.md
      - name: Launch the native Windows app in an isolated profile
        shell: pwsh
        run: ./tool/windows_startup_smoke.ps1 -Executable build/windows/x64/runner/Release/kmreader.exe -OutputDirectory "${{ runner.temp }}/windows-startup"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup
          path: ${{ runner.temp }}/windows-startup/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Release/
  windows_host:
    if: *run_verification
    runs-on: windows-latest
    steps:
      - *checkout
      - name: Validate the deferred Android diagnostic launcher
        shell: powershell
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tool/android_epub_recovery.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
      - *python
      - *provenance
      - *flutter
      - *pub
      - name: Verify Windows updater handoff, replacement and recovery
        shell: powershell
        run: ./tool/test_windows_updater.ps1 -TestHandoff
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
  windows_reader:
    if: *run_verification
    needs: windows_worker
    runs-on: windows-latest
    steps:
      - *checkout
      - *python
      - *provenance
      - *download_kindle_worker
      - *extract_kindle_worker
      - *flutter
      - *windows_desktop
      - *pub
      - name: Verify EPUB in native Windows WebView2
        run: flutter drive --driver=test_driver/native_reader_driver.dart --target=integration_test/epub_reader_test.dart -d windows --no-pub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-reader
          path: artifacts/native-epub/*.png
  android_reader_display:
    if: *run_verification
    needs: android_python_wheels
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - *checkout
      - *python
      - *provenance
      - *android_space
      - *android_java
      - *flutter
      - *android_sdk
      - *clang
      - *pub
      - *ndk_cache
      - *ndk_install
      - *download_android_wheels
      - name: Enable KVM access on the isolated runner
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Bound build memory before starting the emulator
        run: |
          python3 - <<'PYMEM'
          from pathlib import Path
          p=Path('android/gradle.properties')
          lines=p.read_text().splitlines()
          lines=[line for line in lines if not line.startswith(('org.gradle.jvmargs=','org.gradle.workers.max=','kotlin.daemon.jvmargs=','kotlin.compiler.execution.strategy='))]
          lines += ['org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m','org.gradle.workers.max=2','kotlin.compiler.execution.strategy=in-process']
          p.write_text('\n'.join(lines)+'\n')
          PYMEM
      - name: Build one x64 APK for reader, display and installer tests
        run: |
          set -euo pipefail
          mkdir -p .dart_tool/native-test-apks
          fixtures="$RUNNER_TEMP/updater-fixtures"
          baseline=70f4efeb7d4f901586cc69456438da521c0a3d89
          git fetch --no-tags --depth=1 origin "$baseline"
          git show "$baseline:assets/epub/reader.js" > assets/epub/benchmark-baseline.js
          bash tool/prepare_android_update_fixtures.sh "$fixtures"
          flutter build apk --debug --target-platform android-x64 --target=integration_test/android_native_test.dart --no-pub \
            --dart-define=KMREADER_UPDATE_SAME="$(base64 -w0 "$fixtures/same.apk")" \
            --dart-define=KMREADER_UPDATE_OTHER="$(base64 -w0 "$fixtures/other.apk")"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$fixtures/same.keystore" --ks-key-alias fixture --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
            --out .dart_tool/native-test-apks/android-native.apk build/app/outputs/flutter-apk/app-debug.apk
          android/gradlew -p android --stop
          free -m
        env:
          ORG_GRADLE_PROJECT_kmreaderPreview: 'true'
      - name: Reserve AVD space after the dependency build
        run: |
          sudo python3 - "$ANDROID_SDK_ROOT" <<'PYDISK'
          import shutil,sys
          from pathlib import Path
          sdk=Path(sys.argv[1])
          for version in (sdk/'ndk').iterdir():
              if version.is_dir() and version.name!='28.2.13676358': shutil.rmtree(version)
          # The action below installs its one required API 35 image.
          if (sdk/'system-images').exists(): shutil.rmtree(sdk/'system-images')
          PYDISK
          df -h .
      - name: Verify Android reader, cutout and installer on one emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORG_GRADLE_PROJECT_kmreaderPreview: 'true'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          # Google APIs boot services exhausted 1.5GiB before reader startup.
          # Gradle is already stopped; the 16GiB host can retain a 3GiB guest.
          ram-size: 3072M
          heap-size: 256M
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Exercise WebView's real animation clock. Disabling the Android
          # animator can collapse native playback even when JS overrides the
          # prefers-reduced-motion media query inside a functional probe.
          disable-animations: false
          script: bash tool/android_native_smoke.sh
      - name: Capture native runner resource diagnostics
        if: always()
        run: |
          free -m
          df -h /
          ps -eo pid,rss,comm --sort=-rss | head -12 || true
          sudo dmesg --ctime | grep -Ei 'out of memory|oom-kill|killed process' | tail -20 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reader-display
          path: |
            artifacts/native-epub/*.png
            artifacts/android-epub-recovery/report.json
            ${{ runner.temp }}/reader-logcat.txt
  deliver_verified_draft:
    if: github.event_name == 'workflow_dispatch' && inputs.deliver_draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    concurrency:
      group: verified-draft-delivery-${{ inputs.draft_tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_RUN: ${{ inputs.verified_run }}
      APK_DELTAS: ${{ inputs.apk_deltas }}
      ANDROID_UNIVERSAL: ${{ inputs.android_universal }}
      DRAFT_TAG: ${{ inputs.draft_tag }}
      PREVIEW_BLOB: ${{ inputs.preview_blob }}
      PREVIEW_SHA256: ${{ inputs.preview_sha256 }}
      ARMV7_BLOB: ${{ inputs.preview_armv7_blob }}
      ARMV7_SHA256: ${{ inputs.preview_armv7_sha256 }}
      X64_BLOB: ${{ inputs.preview_x64_blob }}
      X64_SHA256: ${{ inputs.preview_x64_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
      - name: Recheck source, complete CI, signatures and bytes; deliver to the existing draft only
        run: python3 tool/deliver_draft.py
