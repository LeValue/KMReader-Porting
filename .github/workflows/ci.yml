name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish the verified Android APK to the development preview release
        type: boolean
        default: false
      preview_blob:
        description: Git blob containing the locally signed optimized preview APK
        type: string
        default: ''
      preview_sha256:
        description: SHA256 of the verified signed APK
        type: string
        default: ''
      preview_armv7_blob:
        description: Git blob of the signed ARMv7 APK
        type: string
        default: ''
      preview_armv7_sha256:
        description: SHA256 of the signed ARMv7 APK
        type: string
        default: ''
      preview_x64_blob:
        description: Git blob of the signed x86_64 APK
        type: string
        default: ''
      preview_x64_sha256:
        description: SHA256 of the signed x86_64 APK
        type: string
        default: ''
      verified_run:
        description: Optional completed successful CI run for this exact source; avoids duplicate builds
        type: string
        default: ''
permissions:
  contents: read
jobs:
  android_reader_display:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_preview || inputs.verified_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/prepare_build_metadata.py
      - name: Reserve disk space for the emulator and Android build
        run: |
          # This job uses neither .NET, Haskell nor CodeQL. Only the disposable
          # runner's preinstalled toolchains are removed; the checkout is kept.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/ghc /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: flutter pub get --enforce-lockfile
      - name: Restore the pinned Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: kmreader-ndk-${{ runner.os }}-28.2.13676358
      - name: Install and verify the pinned Android NDK
        run: bash tool/install_android_ndk.sh
      - name: Enable KVM access on the isolated runner
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Bound build memory before starting the emulator
        run: |
          python3 - <<'PYMEM'
          from pathlib import Path
          p=Path('android/gradle.properties')
          lines=p.read_text().splitlines()
          lines=[line for line in lines if not line.startswith(('org.gradle.jvmargs=','org.gradle.workers.max=','kotlin.daemon.jvmargs=','kotlin.compiler.execution.strategy='))]
          lines += ['org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m','org.gradle.workers.max=2','kotlin.compiler.execution.strategy=in-process']
          p.write_text('\n'.join(lines)+'\n')
          PYMEM
      - name: Compile both native test applications before allocating emulator memory
        run: |
          set -euo pipefail
          mkdir -p .dart_tool/native-test-apks
          flutter build apk --debug --target=integration_test/reader_display_test.dart --no-pub
          cp build/app/outputs/flutter-apk/app-debug.apk .dart_tool/native-test-apks/display.apk
          flutter build apk --debug --target=integration_test/epub_reader_test.dart --no-pub
          cp build/app/outputs/flutter-apk/app-debug.apk .dart_tool/native-test-apks/reader.apk
          android/gradlew -p android --stop
          free -m
        env:
          ORG_GRADLE_PROJECT_kmreaderPreview: 'true'
      - name: Reserve AVD space after the dependency build
        run: |
          sudo python3 - "$ANDROID_SDK_ROOT" <<'PYDISK'
          import shutil,sys
          from pathlib import Path
          sdk=Path(sys.argv[1])
          for version in (sdk/'ndk').iterdir():
              if version.is_dir() and version.name!='28.2.13676358': shutil.rmtree(version)
          # The action below installs its one required API 35 image.
          if (sdk/'system-images').exists(): shutil.rmtree(sdk/'system-images')
          PYDISK
          df -h .
      - name: Exercise real Android WindowInsets with a simulated notch
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORG_GRADLE_PROJECT_kmreaderPreview: 'true'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 1536M
          heap-size: 256M
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tool/android_native_smoke.sh
      - name: Capture native runner resource diagnostics
        if: always()
        run: |
          free -m
          df -h /
          ps -eo pid,rss,comm --sort=-rss | head -12 || true
          sudo dmesg --ctime | grep -Ei 'out of memory|oom-kill|killed process' | tail -20 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reader-display
          path: |
            artifacts/android-reader-display/*.png
            artifacts/native-epub/*.png
            ${{ runner.temp }}/reader-logcat.txt
