name: EPUB curl handoff A-B

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Execute the isolated renderer on this platform
        type: choice
        options: [webview2, emulator, physical]
        required: true

permissions:
  contents: read

jobs:
  pc:
    if: inputs.engine != 'emulator'
    runs-on: [self-hosted, Windows, X64, kmreader-android-desktop]
    concurrency: kmreader-local-windows-pc-kmreader-android-desktop
    timeout-minutes: 15
    steps:
      - name: Mask local profile paths
        shell: powershell
        run: |
          Write-Output "::add-mask::$env:USERPROFILE"
          Write-Output "::add-mask::$($env:USERPROFILE.Replace('\', '\\'))"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up the isolated WebView probe
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pillow 'playwright>=1.60' pywebview
          New-Item -ItemType Directory -Force artifacts/curl-handoff | Out-Null
      - name: Trace WebView2 mouse drags
        if: inputs.engine == 'webview2'
        shell: powershell
        run: |
          . ./tool/windows_interactive_desktop.ps1
          Assert-KmReaderInteractiveDesktop
          python tool/epub_curl_handoff_smoke.py --webview2 --columns 2 --width 1000 --height 720 --dpr 1.25 --output artifacts/curl-handoff/webview2.json
      - name: Trace touch drags on a connected Android phone
        if: inputs.engine == 'physical'
        shell: powershell
        run: python tool/epub_curl_handoff_smoke.py --android physical --touch --output artifacts/curl-handoff/android-phone.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curl-handoff-${{ inputs.engine }}
          path: artifacts/curl-handoff/*.json
          if-no-files-found: ignore

  emulator:
    if: inputs.engine == 'emulator'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0 platforms;android-36
      - name: Prepare the temporary Android WebView host
        run: |
          python -m pip install --disable-pip-version-check pillow 'playwright>=1.60'
          mkdir -p artifacts/curl-handoff
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: python tool/epub_curl_handoff_smoke.py --android emulator --touch --chapter-turns --output artifacts/curl-handoff/android-emulator.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curl-handoff-emulator
          path: artifacts/curl-handoff/*.json
          if-no-files-found: ignore
