name: Personal Kindle read-only probe
on:
  workflow_call:
    inputs:
      prototype_run:
        type: string
        required: true
      runner_label:
        type: string
        default: kmreader-android-desktop
  workflow_dispatch:
    inputs:
      prototype_run:
        description: Successful Kindle prototype build run for this source
        type: string
        required: true
      runner_label:
        description: Previously configured personal runner label
        type: choice
        options: [kmreader-android-desktop, kmreader-laptop]
        default: kmreader-android-desktop
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, '${{ inputs.runner_label }}']
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - if: inputs.prototype_run == 'source' || inputs.prototype_run == 'services'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run read-only source probe in an isolated environment
        if: inputs.prototype_run == 'source' || inputs.prototype_run == 'services'
        shell: powershell
        env:
          PROBE_MODE: ${{ inputs.prototype_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          $environment = Join-Path $env:RUNNER_TEMP ('kindle-source-' + $env:GITHUB_RUN_ID)
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create isolated probe environment' }
          $python = Join-Path $environment 'Scripts/python.exe'
          & $python -m pip install -r tool/kindle_personal/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install pinned probe dependencies' }
          New-Item artifacts/kindle-personal-probe -ItemType Directory -Force | Out-Null
          if ($env:PROBE_MODE -eq 'services') {
            & $python -m tool.kindle_personal probe --services --output artifacts/kindle-personal-probe/report.json
          } else {
            & $python -m tool.kindle_personal probe --output artifacts/kindle-personal-probe/report.json
          }
          if ($LASTEXITCODE -ne 0) { throw 'Read-only source probe did not complete' }
      - uses: actions/download-artifact@v4
        if: inputs.prototype_run != 'source' && inputs.prototype_run != 'services'
        with:
          name: KMReader-Kindle-windows-x64
          run-id: ${{ inputs.prototype_run }}
          github-token: ${{ github.token }}
          path: artifacts/kindle-probe-build
      - name: Validate the exact-source companion and run GET-only Amazon probes
        if: inputs.prototype_run != 'source' && inputs.prototype_run != 'services'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem artifacts/kindle-probe-build -Filter 'KMReader-Kindle-*-windows-x64.zip' -Recurse)
          if ($archives.Count -ne 1) { throw 'Expected exactly one companion archive' }
          $sums = Get-ChildItem artifacts/kindle-probe-build -Filter SHA256SUMS.txt -Recurse | Select-Object -First 1
          $line = Get-Content $sums.FullName | Where-Object { $_.EndsWith($archives[0].Name) }
          if (-not $line -or (Get-FileHash $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $line.Substring(0,64)) { throw 'Companion checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP ('kindle-read-only-' + $env:GITHUB_RUN_ID)
          Expand-Archive $archives[0].FullName -DestinationPath $destination -Force
          $build = Get-Content (Join-Path $destination build.json) -Raw | ConvertFrom-Json
          git fetch --no-tags origin $build.source
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the companion source' }
          git diff --exit-code $build.source $env:GITHUB_SHA -- tool/kindle_personal tool/kindle_personal_cli.py tool/package_kindle_prototype.py
          if ($LASTEXITCODE -ne 0) { throw 'The companion code must be identical to the tested source' }
          $executable = Join-Path $destination 'KMReader-Kindle/KMReader-Kindle.exe'
          New-Item artifacts/kindle-personal-probe -ItemType Directory -Force | Out-Null
          & $executable probe --output artifacts/kindle-personal-probe/report.json
          if ($LASTEXITCODE -ne 0) { throw 'Read-only probe did not complete; no private files will be uploaded' }
      - uses: actions/upload-artifact@v4
        with:
          name: kindle-personal-read-only-probe
          path: artifacts/kindle-personal-probe/report.json
          if-no-files-found: error
