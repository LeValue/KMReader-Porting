name: Local Windows diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only environment check or native reader tests
        type: choice
        options: [inspect, native]
        default: inspect

permissions:
  contents: read

concurrency:
  group: kmreader-local-windows
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 50
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect graphics session and build prerequisites
        run: ./tool/windows_local_diagnostics.ps1
      - name: Select native Git Bash for Flutter setup
        if: inputs.mode == 'native'
        run: |
          $git = (Get-Command git -ErrorAction Stop).Source
          $gitRoot = Split-Path (Split-Path $git)
          $bashDirectory = Join-Path $gitRoot 'bin'
          if (-not (Test-Path (Join-Path $bashDirectory 'bash.exe'))) {
            throw 'Git for Windows with Git Bash is required for the Flutter setup action.'
          }
          $bashDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: subosito/flutter-action@v2
        if: inputs.mode == 'native'
        with:
          flutter-version: '3.47.8'
          cache: true
      - name: Resolve locked dependencies
        if: inputs.mode == 'native'
        run: |
          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native reader regression tests
        if: inputs.mode == 'native'
        run: |
          $env:KMREADER_DATA_DIR = Join-Path $env:RUNNER_TEMP "kmreader-native-${{ github.run_id }}"
          flutter drive --driver=test_driver/native_reader_driver.dart --target=integration_test/epub_reader_test.dart -d windows --no-pub 2>&1 | Tee-Object artifacts/local-windows/native-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-windows-diagnostics
          path: |
            artifacts/local-windows/
            artifacts/native-epub/
          retention-days: 7
