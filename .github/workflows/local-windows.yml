name: Local Windows diagnostics

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Target a specific registered PC
        type: choice
        options: [kmreader-laptop, kmreader-android-desktop, self-hosted]
        default: kmreader-laptop
      mode:
        description: Environment, native regression tests, or profile frame timings
        type: choice
        options: [inspect, native, profile, responsiveness, android-epub-recovery]
        default: inspect
      publication:
        description: Profile fixture or the requested Alice download in KMReader
        type: choice
        options: [generated, cached-alice, alice-gutenberg]
        default: generated
      prebuilt_run:
        description: Reuse an existing responsiveness bundle or Android diagnostic APK with identical app/test source
        type: string
        default: ''
      expected_runner:
        description: Optional exact PC runner name for the Android USB test
        type: string
        default: ''
      android_renderer:
        description: Flutter renderer for the isolated Android diagnostic app
        type: choice
        options: [default, skia]
        default: default
      android_composition:
        description: WebView composition for the isolated Android diagnostic app
        type: choice
        options: [auto, texture, hybrid]
        default: auto

permissions:
  contents: read
  actions: read

jobs:
  android_recovery:
    if: inputs.mode == 'android-epub-recovery'
    uses: ./.github/workflows/local-android.yml
    with:
      runner_label: ${{ inputs.runner_label }}
      prebuilt_run: ${{ inputs.prebuilt_run }}
      expected_runner: ${{ inputs.expected_runner }}
      renderer: ${{ inputs.android_renderer }}
      composition: ${{ inputs.android_composition }}
  build_test:
    if: inputs.mode != 'inspect' && inputs.mode != 'android-epub-recovery' && inputs.prebuilt_run == ''
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build a separate diagnostic application
        id: build
        shell: pwsh
        env:
          DIAGNOSTIC_MODE: ${{ inputs.mode }}
        run: |
          # Keep the test WebView cache separate from the installed reader.
          $resource = 'windows/runner/Runner.rc'
          (Get-Content $resource -Raw).Replace('"ProductName", "KMReader"', '"ProductName", "KMReader Diagnostics"') | Set-Content $resource
          if ($env:DIAGNOSTIC_MODE -eq 'responsiveness') {
            # Same measurement code, two production runtimes. Build both here
            # to reuse C++ compilation and compare them on the selected PC.
            $baseline = 'f4f0d806d83471c3cecf61cfdf9bb3f17132bb04'
            git fetch --no-tags origin $baseline
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $paths = @('assets/epub/reader.js', 'lib/features/reader/epub_reader.dart')
            $original = @{}
            foreach ($path in $paths) { $original[$path] = [IO.File]::ReadAllText((Join-Path $PWD $path)) }
            $bundle = '.dart_tool/response-bundles'
            New-Item -ItemType Directory -Force -Path $bundle | Out-Null
            try {
              foreach ($path in $paths) {
                $text = (git show "${baseline}:$path") -join "`n"
                if ($LASTEXITCODE -ne 0) { throw 'Cannot read the baseline runtime.' }
                [IO.File]::WriteAllText((Join-Path $PWD $path), $text)
              }
              flutter build windows --release --target=tool/epub_responsiveness.dart --dart-define=KMREADER_PROFILE_RUNTIME_SOURCE=$baseline --no-pub
              if ($LASTEXITCODE -ne 0) { throw 'Baseline probe compilation failed.' }
              Copy-Item -Recurse -Path build/windows/x64/runner/Release -Destination "$bundle/baseline"
            } finally {
              foreach ($path in $paths) { [IO.File]::WriteAllText((Join-Path $PWD $path), $original[$path]) }
            }
            flutter build windows --release --target=tool/epub_responsiveness.dart --dart-define=KMREADER_PROFILE_RUNTIME_SOURCE=${{ github.sha }} --no-pub
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item -Recurse -Path build/windows/x64/runner/Release -Destination "$bundle/optimized"
          } elseif ($env:DIAGNOSTIC_MODE -eq 'profile') {
            flutter build windows --profile --target=integration_test/epub_frame_times_test.dart --no-pub
            $bundle = 'build/windows/x64/runner/Profile'
          } else {
            flutter build windows --debug --target=integration_test/epub_reader_test.dart --no-pub
            $bundle = 'build/windows/x64/runner/Debug'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "bundle=$bundle" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Smoke test the standalone responsiveness probe
        if: inputs.mode == 'responsiveness'
        shell: pwsh
        run: |
          foreach ($variant in @('baseline', 'optimized')) {
            ./tool/windows_epub_responsiveness.ps1 -Executable ".dart_tool/response-bundles/$variant/kmreader.exe" -OutputDirectory "artifacts/local-windows/$variant"
          }
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'responsiveness'
        with:
          name: hosted-responsiveness-smoke
          path: artifacts/local-windows/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: local-windows-test-app
          path: ${{ steps.build.outputs.bundle }}/
          retention-days: 7
  inspect:
    needs: build_test
    if: ${{ !cancelled() && inputs.mode != 'android-epub-recovery' && (needs.build_test.result == 'success' || needs.build_test.result == 'skipped') }}
    runs-on: [self-hosted, Windows, X64, '${{ inputs.runner_label }}']
    concurrency:
      group: kmreader-local-windows-pc-${{ inputs.runner_label }}
      cancel-in-progress: false
    timeout-minutes: 50
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect graphics session and build prerequisites
        run: ./tool/windows_local_diagnostics.ps1
      - name: Verify the source of a reused responsiveness bundle
        if: inputs.prebuilt_run != ''
        env:
          PREBUILT_RUN: ${{ inputs.prebuilt_run }}
          DIAGNOSTIC_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:DIAGNOSTIC_MODE -ne 'responsiveness' -or $env:PREBUILT_RUN -notmatch '^[1-9][0-9]*$') { throw 'Only a numbered responsiveness build can be reused.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $run = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GH_REPO/actions/runs/$env:PREBUILT_RUN"
          if ($run.repository.full_name -ne $env:GH_REPO -or $run.head_branch -ne 'main' -or $run.event -ne 'workflow_dispatch' -or $run.path -ne '.github/workflows/local-windows.yml' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.head_sha -notmatch '^[0-9a-f]{40}$') { throw 'The prebuilt bundle must come from a successful main-branch diagnostic run.' }
          git fetch --no-tags origin $run.head_sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = git diff --name-only $run.head_sha HEAD -- lib assets pubspec.yaml pubspec.lock third_party windows android tool/epub_responsiveness.dart test/support/epub_fixture.dart
          if ($LASTEXITCODE -ne 0 -or $changed) { throw 'The prebuilt application or measurement code differs from this source.' }
          Write-Output "Verified unchanged application and measurement source from run $env:PREBUILT_RUN."
      - name: Set up the verified Flutter SDK in the runner tool cache
        if: inputs.mode == 'native' || inputs.mode == 'profile'
        run: ./tool/setup_local_flutter.ps1
      - name: Resolve locked dependencies
        if: inputs.mode == 'native' || inputs.mode == 'profile'
        run: |
          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Only the Dart driver runs locally. Avoid Flutter's plugin-link
          # generation, which requires changing Windows Developer Mode.
          $env:FLUTTER_ROOT = Split-Path (Split-Path (Get-Command flutter).Source)
          dart pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        if: inputs.mode != 'inspect'
        with:
          name: local-windows-test-app
          path: .dart_tool/native-prebuilt
          run-id: ${{ inputs.prebuilt_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Run native reader regression tests
        if: inputs.mode == 'native'
        run: |
          $env:KMREADER_DATA_DIR = Join-Path $env:RUNNER_TEMP "kmreader-native-${{ github.run_id }}"
          $ErrorActionPreference = 'Continue'
          flutter drive --use-application-binary=.dart_tool/native-prebuilt/kmreader.exe --driver=test_driver/native_reader_driver.dart --target=integration_test/epub_reader_test.dart -d windows --no-pub 2>&1 | Tee-Object artifacts/local-windows/native-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure real application responsiveness and process cost
        if: inputs.mode == 'responsiveness'
        env:
          KMREADER_PROFILE_PUBLICATION: ${{ inputs.publication }}
        run: |
          if ($env:KMREADER_PROFILE_PUBLICATION -eq 'cached-alice') {
            $env:KMREADER_PROFILE_EPUB = ./tool/find_cached_alice.ps1
          }
          if ($env:KMREADER_PROFILE_PUBLICATION -eq 'alice-gutenberg') {
            $ProgressPreference = 'SilentlyContinue'
            $alice = Join-Path $env:RUNNER_TEMP 'kmreader-alice-reference.epub'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.gutenberg.org/ebooks/11.epub3.images' -OutFile $alice
            $env:KMREADER_PROFILE_EPUB = $alice
          }
          foreach ($variant in @('baseline', 'optimized')) {
            ./tool/windows_epub_responsiveness.ps1 -Executable ".dart_tool/native-prebuilt/$variant/kmreader.exe" -OutputDirectory "artifacts/local-windows/$variant"
          }
      - name: Measure native EPUB frame timings in profile mode
        if: inputs.mode == 'profile'
        env:
          KMREADER_PROFILE_PUBLICATION: ${{ inputs.publication }}
        run: |
          $env:KMREADER_DATA_DIR = Join-Path $env:RUNNER_TEMP "kmreader-profile-${{ github.run_id }}"
          if ($env:KMREADER_PROFILE_PUBLICATION -eq 'cached-alice') {
            $env:KMREADER_PROFILE_EPUB = ./tool/find_cached_alice.ps1
          }
          if ($env:KMREADER_PROFILE_PUBLICATION -eq 'alice-gutenberg') {
            $ProgressPreference = 'SilentlyContinue'
            $alice = Join-Path $env:RUNNER_TEMP 'kmreader-alice-reference.epub'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.gutenberg.org/ebooks/11.epub3.images' -OutFile $alice
            $env:KMREADER_PROFILE_EPUB = $alice
          }
          $ErrorActionPreference = 'Continue'
          flutter drive --profile --use-application-binary=.dart_tool/native-prebuilt/kmreader.exe --driver=test_driver/epub_frame_times_driver.dart --target=integration_test/epub_frame_times_test.dart -d windows --no-pub 2>&1 | Tee-Object artifacts/local-windows/profile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-windows-diagnostics
          path: |
            artifacts/local-windows/
            artifacts/native-epub/
          retention-days: 7
