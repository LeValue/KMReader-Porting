name: Local Windows diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Environment, native regression tests, or profile frame timings
        type: choice
        options: [inspect, native, profile]
        default: inspect

permissions:
  contents: read

concurrency:
  group: kmreader-local-windows
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 50
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect graphics session and build prerequisites
        run: ./tool/windows_local_diagnostics.ps1
      - name: Set up the verified Flutter SDK in the runner tool cache
        if: inputs.mode != 'inspect'
        run: ./tool/setup_local_flutter.ps1
      - name: Resolve locked dependencies
        if: inputs.mode != 'inspect'
        run: |
          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native reader regression tests
        if: inputs.mode == 'native'
        run: |
          $env:KMREADER_DATA_DIR = Join-Path $env:RUNNER_TEMP "kmreader-native-${{ github.run_id }}"
          $ErrorActionPreference = 'Continue'
          flutter drive --driver=test_driver/native_reader_driver.dart --target=integration_test/epub_reader_test.dart -d windows --no-pub 2>&1 | Tee-Object artifacts/local-windows/native-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure native EPUB frame timings in profile mode
        if: inputs.mode == 'profile'
        run: |
          $env:KMREADER_DATA_DIR = Join-Path $env:RUNNER_TEMP "kmreader-profile-${{ github.run_id }}"
          $ErrorActionPreference = 'Continue'
          flutter drive --profile --driver=test_driver/epub_frame_times_driver.dart --target=integration_test/epub_frame_times_test.dart -d windows --no-pub 2>&1 | Tee-Object artifacts/local-windows/profile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-windows-diagnostics
          path: |
            artifacts/local-windows/
            artifacts/native-epub/
          retention-days: 7
