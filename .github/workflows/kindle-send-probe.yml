name: Personal Kindle send check
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Personal PC with an existing DPAPI Kindle session
        type: choice
        options: [kmreader-android-desktop, kmreader-laptop]
        default: kmreader-android-desktop
      app_import:
        description: Exercise the app importer and its generated-document acceptance check
        type: boolean
        default: false
      upload_fixture:
        description: Send one generated EPUB; preserve its private journal and never replay it
        type: boolean
        default: false
      delivery_mode:
        description: Delivery verification; new modes use separate private journals
        type: choice
        options: [existing-library, library, device]
        default: existing-library
      management_fixture:
        description: Exact generated fixture eligible for management checks
        type: choice
        options: [original, library]
        default: original
      replacement_probe:
        description: Update only the generated cloud fixture and verify state restoration before retirement
        type: boolean
        default: false
      cloud_only:
        description: Read-only cloud ownership diagnostics; no native download or mutations
        type: boolean
        default: false
      bookmark_probe:
        description: Verify one bookmark on the exact generated test document only
        type: boolean
        default: false
      management_probe:
        description: Verify deletion of the exact generated test document, preserving its private recovery journal
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  registration:
    runs-on: [self-hosted, Windows, X64, '${{ inputs.runner_label }}']
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: inputs.bookmark_probe || inputs.replacement_probe && !inputs.cloud_only
        uses: actions/download-artifact@v4
        with:
          name: windows
          run-id: '42483122851'
          github-token: ${{ github.token }}
          path: artifacts/kindle-probe-worker
      - if: inputs.bookmark_probe || inputs.replacement_probe && !inputs.cloud_only
        name: Verify the preserved native conversion worker source
        run: |
          $build = Get-Content artifacts/kindle-probe-worker/data/flutter_assets/assets/build/source.json -Raw | ConvertFrom-Json
          git fetch --no-tags origin $build.source
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify native worker source' }
          git diff --exit-code $build.source $env:GITHUB_SHA -- tool/kindle_personal tool/kindle_android tool/kindle_personal_cli.py third_party
          if ($LASTEXITCODE -ne 0) { throw 'Conversion worker source mismatch' }
      - run: ./tool/setup_local_flutter.ps1
      - name: Resolve locked source dependencies
        run: |
          $env:FLUTTER_ROOT = Split-Path (Split-Path (Get-Command flutter).Source)
          dart pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve source probe dependencies' }
      - name: Check saved send credentials and the explicitly selected synthetic upload
        env:
          KMREADER_KINDLE_PROBE_UPLOAD_FIXTURE: ${{ inputs.upload_fixture }}
          KMREADER_KINDLE_PROBE_DELIVERY_MODE: ${{ inputs.delivery_mode }}
          PROBE_APP_IMPORT: ${{ inputs.app_import }}
          KMREADER_KINDLE_MANAGEMENT_FIXTURE: ${{ inputs.management_fixture }}
          PROBE_REPLACEMENT: ${{ inputs.replacement_probe }}
          KMREADER_KINDLE_CLOUD_ONLY: ${{ inputs.cloud_only }}
          PROBE_BOOKMARKS: ${{ inputs.bookmark_probe }}
          PROBE_MANAGEMENT: ${{ inputs.management_probe }}
        run: |
          $ErrorActionPreference = 'Stop'
          $private = Join-Path $env:RUNNER_TEMP ('kindle-send-private-' + $env:GITHUB_RUN_ID)
          New-Item $private -ItemType Directory -Force | Out-Null
          New-Item artifacts/kindle-send-report -ItemType Directory -Force | Out-Null
          $session = Join-Path $private 'session.json'
          try {
            python -m tool.kindle_send_probe_bridge export $session
            if ($LASTEXITCODE -ne 0) { throw 'Existing personal Kindle session unavailable; no login attempted' }
            if ($env:PROBE_REPLACEMENT -eq 'true') {
              $env:KMREADER_KINDLE_MANAGEMENT_PRIVATE_SESSION = $session
              $env:KMREADER_KINDLE_MANAGEMENT_REPORT = Join-Path $PWD 'artifacts/kindle-send-report/report.json'
              $env:KMREADER_KINDLE_WORKER = Join-Path $PWD 'artifacts/kindle-probe-worker/kindle/KMReader-Kindle.exe'
              flutter test test/kindle_replacement_probe_test.dart --no-pub
            } elseif ($env:PROBE_BOOKMARKS -eq 'true') {
              $env:KMREADER_KINDLE_MANAGEMENT_PRIVATE_SESSION = $session
              $env:KMREADER_KINDLE_MANAGEMENT_REPORT = Join-Path $PWD 'artifacts/kindle-send-report/report.json'
              $env:KMREADER_KINDLE_WORKER = Join-Path $PWD 'artifacts/kindle-probe-worker/kindle/KMReader-Kindle.exe'
              flutter test test/kindle_bookmark_probe_test.dart --no-pub
            } elseif ($env:PROBE_MANAGEMENT -eq 'true') {
              $env:KMREADER_KINDLE_MANAGEMENT_PRIVATE_SESSION = $session
              $env:KMREADER_KINDLE_MANAGEMENT_REPORT = Join-Path $PWD 'artifacts/kindle-send-report/report.json'
              flutter test test/kindle_management_probe_test.dart --no-pub
            } elseif ($env:PROBE_APP_IMPORT -eq 'true') {
              $env:KMREADER_KINDLE_UPLOAD_PRIVATE_SESSION = $session
              $env:KMREADER_KINDLE_UPLOAD_PROBE_REPORT = Join-Path $PWD 'artifacts/kindle-send-report/report.json'
              flutter test test/kindle_upload_probe_test.dart --no-pub
            } else {
              $env:KMREADER_KINDLE_SEND_PRIVATE_SESSION = $session
              $env:KMREADER_KINDLE_SEND_PROBE_REPORT = Join-Path $PWD 'artifacts/kindle-send-report/report.json'
              flutter test test/kindle_send_probe_test.dart --no-pub
            }
            $result = $LASTEXITCODE
            python -m tool.kindle_send_probe_bridge seal $session
            if ($LASTEXITCODE -ne 0) { throw 'Cannot retain probe credentials in the local DPAPI vault' }
            if ($result -ne 0) { throw 'STK check failed; only sanitized metrics will be uploaded' }
          } finally {
            Remove-Item Env:KMREADER_KINDLE_WORKER -ErrorAction SilentlyContinue
            Remove-Item Env:KMREADER_KINDLE_SEND_PRIVATE_SESSION -ErrorAction SilentlyContinue
            Remove-Item Env:KMREADER_KINDLE_SEND_PROBE_REPORT -ErrorAction SilentlyContinue
            Remove-Item Env:KMREADER_KINDLE_UPLOAD_PRIVATE_SESSION -ErrorAction SilentlyContinue
            Remove-Item Env:KMREADER_KINDLE_UPLOAD_PROBE_REPORT -ErrorAction SilentlyContinue
            Remove-Item Env:KMREADER_KINDLE_MANAGEMENT_PRIVATE_SESSION -ErrorAction SilentlyContinue
            Remove-Item Env:KMREADER_KINDLE_MANAGEMENT_REPORT -ErrorAction SilentlyContinue
            Remove-Item $private -Recurse -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kindle-send-registration-metrics
          path: artifacts/kindle-send-report/report.json
          if-no-files-found: error
          retention-days: 7
